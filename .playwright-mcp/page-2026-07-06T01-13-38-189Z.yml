          - generic [ref=f2e963]:
            - heading "7.1 学生身份" [level=1] [ref=f2e1177]
            - blockquote [ref=f2e965]:
              - paragraph [ref=f2e966]:
                - text: 来源：
                - link "自学成AI产品经理" [ref=f2e967] [cursor=pointer]:
                  - /url: https://stevenjokess.github.io/2bPM/chapter_AI_job/school.html
            - separator [ref=f2e968]
            - heading "📌 实习生" [level=2] [ref=f2e1178]
            - paragraph [ref=f2e970]: 不属于劳动法调整范围
            - paragraph [ref=f2e972]: 兼职打工，已经成为不少学生补充个人收入的主要来源，尤其是一些贫困地区的学生，假期打工挣钱可以负担一部分的学习生活费用。原劳动部颁发的《关于贯彻执行〈中华人民共和国劳动法〉若干问题的意见》中第12条规定："在校生利用业余时间勤工助学，不视为就业，未建立劳动关系，可以不签订劳动合同。"
            - paragraph [ref=f2e978]: 在校大学生徐霞兼职在北京一家大型超市门口派发传单，每天从早上9点到下午4点，中午休息1个小时，每天报酬80元。
            - paragraph [ref=f2e982]: "\"因为是兼职，和用人单位没有签订劳动合同，自然也谈不上交社保了。\"徐霞说。"
            - paragraph [ref=f2e984]: 北京律师肖东平认为，由于学生的身份所限，在校学生实习和见习，不属于劳动法的调整范围，用人单位不必与其签订劳动合同，也不必为其购买社保，因此相对而言企业也喜欢用兼职学生，这样可节省开支。"建议相关部门在制定对学生利用业余时间打工这方面的政策时，一方面要保障企业的利益，同时也要考虑对兼职学生利益的保护。"
            - separator [ref=f2e980]
            - heading "📌 大厂的组织架构" [level=2] [ref=f2e1179]
            - paragraph [ref=f2e1004]: 一个部门的HC（Head count员工人头数），是业务初期业务负责人、HR、部门经理定好的，是固定的，而实习生是不占用HC的。实习生想转正，必须要有空余的HC，就是所谓的一个萝卜一个坑。HC有空出来，要么是有人离职，要么是业务出现了新的工作内容，现有人员负载不过来，部门经理苦口婆心向上申请到了新的HC。
            - separator [ref=f2e992]
            - heading "📌 能做的" [level=2] [ref=f2e1180]
            - paragraph [ref=f2e1006]: 1.参与到一个项目中去;
            - paragraph [ref=f2e1009]: 如果组内有项目，和上司争取，让自己加入到这个项目中，哪怕只是帮他整理资料，然后主动去了解整个项目的背景、各个阶段的目标、各个角色的分工，各部门协同流程等等，尝试按照star法则（结构化面试的重要理论，百度就能查到）来描述各个部门的工作内容及工作产出。
            - paragraph [ref=f2e1019]: 后面可以挑你真正熟悉的模块丰富到简历中去。
            - paragraph [ref=f2e1023]: 2.增强自己的跨部门协同能力：
            - paragraph [ref=f2e1027]: 如果组内有需要和其他部门沟通协调的事情，尽量参与进去，同时想如果是自己单独推进会怎么来沟通，记住一点：你要推进和协调的事情，要尽量能让其他部门写到他的述职或者晋升报告中，这样你才好推。跨部门协同是有技巧的，要反复总结。
            - paragraph [ref=f2e1028]: 3.利用好大厂的线上学习平台：
            - paragraph [ref=f2e1034]: 很多大厂都是有自己的线上学习平台的，里面包括很多成型的方法论、各个岗位的工作技巧、经验分享等等。我的建议是在实习期间给自己制定学习计划，比如你要做产品经理，就把相关的课程按照一定的时间节奏全学完，能白嫖的为啥不搞。有条件的录个屏反复研究。
            - separator [ref=f2e1002]
            - heading "📌 试用期" [level=2] [ref=f2e1181]
            - heading "警惕试用陷阱" [level=3] [ref=f2e1182]
            - blockquote [ref=f2e974]:
              - paragraph [ref=f2e975]: ⚠️ 个别公司会以试用期的名义，来获取廉价的劳动力，这一陷阱同样需要警惕。
            - paragraph [ref=f2e1041]: 1)试用合格才签劳动合同
            - paragraph [ref=f2e1075]: 先试用再签劳动合同，一般有试用阶段不签劳动合同、仅仅签订试用期合同、同时签订试用期合同和劳动合同等表现形式。
            - paragraph [ref=f2e1085]: 根据《劳动合同法》第19条规定，"试用期包含在劳动合同期限內。劳动合同仅约定试用期的，试用期不成立，该期限为劳动合同期限。"简而言之，试用期是依附于劳动合同，以劳动合同为前提条件的，没有劳动合同就没有使用条款，更不存在单独的"试用期合同"。
            - paragraph [ref=f2e1088]: 2)试用期与合同期限不符
            - paragraph [ref=f2e1089]: 有些用人单位会在试用期的时间上玩心眼，随意确定试用期。比如有的单位和劳动者签一年的劳动合同，试用期却长达6个月。
            - paragraph [ref=f2e1091]: 根据《劳动合同法》规定，劳动合同期限3个月以上不满一年的，试用期不得超过1个月；劳动合同期限1年以上不满三年的，试用期不得超过2个月；3年以上固定期限和无固定期限的劳动合同，试用期不得超过6个月。
            - paragraph [ref=f2e1095]: 3)擅自延长或多次使用试用期
            - paragraph [ref=f2e1098]: 有些用人单位在第一次试用快要结束时，以时间太短、考察不全面等理由对原来的试用期进行延长或与劳动者重新约定一个或多个试用期。
            - paragraph [ref=f2e1101]: 根据《劳动合同法》第19条规定，同一用人单位只能约定一次试用期。
            - paragraph [ref=f2e1105]: 4)试用期工资低于最低工资
            - paragraph [ref=f2e1113]: 有些用人单位把试用期当做"廉价"劳动力，试用期常常低于最低工资标准甚至"零工资"。
            - paragraph [ref=f2e1115]: 《劳动合同法》第20条规定，劳动者在试用期的工资不得低于本单位相同岗位最低档工资或劳动合同约定工资的80%，并不得低于用人单位所在地的最低工资标准。
            - blockquote [ref=f2e985]:
              - paragraph [ref=f2e986]: 💡 劳动者的"试用期"绝非"廉价期"，更非"白用期"。
            - paragraph [ref=f2e1122]: 5)不缴纳社会保险
            - paragraph [ref=f2e1123]: 有的用人单位为了降低成本，告知劳动者试用期满后再办理社会保险，但不论是用人单位和劳动者私下约定免缴社会保险，还是用人单位以商业保险取代社会保险，都是违法的，也是无效的。
            - paragraph [ref=f2e1131]: 6)随意辞退劳动者
            - paragraph [ref=f2e1154]: 试用期同样不能随意解除劳动合同。
            - paragraph [ref=f2e1183]: 根据《劳动合同法》第21条，想要解除试用期员工，同样需要证明其存在不符合录用条件、严重违纪、严重失职、劳动合同无效等法定解除情形。
            - paragraph [ref=f2e1184]: 如果不能证明就随意解除，属于违法解约，劳动者有权主张赔偿。
            - paragraph [ref=f2e1185]: 劳动合同是保障劳动者实现劳动权益的重要法律形式之一，求职者应学会拿起法律武器，避免掉入"试用期陷阱"，在试用期内合法保护自己的权益。如果遇到劳动争议，可以询问律师，或者拨打劳动保障政策咨询电话12333举报。
            - separator [ref=f2e1015]
            - heading "📌 校招" [level=2] [ref=f2e1186]
            - paragraph [ref=f2e1187]: 国内校招的各个高峰期时间段
            - list [ref=f2e995]:
              - listitem [ref=f2e996]: "企业校招（秋招）: 8月-12月"
              - listitem [ref=f2e998]: "企业补招（春招）: 次年3月-5月"
              - listitem [ref=f2e1000]: "政府事业单位: 11月-次年5月"
            - paragraph [ref=f2e1188]: 值得注意的是，2022校招并不是在2022 年举行的，而是从2021年的8、9月份就开始了，会持续到2022年的6月份。
            - paragraph [ref=f2e1189]: 招聘面向的是国内2021.7左右毕业的应届毕业生。每年的 8、9 月份-12月份的秋招，基本上是企业校招的高峰；到了第二年的上半年的春招，公务员和事业单位就成为了校招的重点。
            - paragraph [ref=f2e1190]: 但是，每年的校园招聘都开启的猝不及防，尤其互联网公司，每年都会提前，而且各公司的开启时间不一，秋招信息十分零散杂乱，导致第一次参加校园招聘的同学们，一不小心就会错失投递良机。
