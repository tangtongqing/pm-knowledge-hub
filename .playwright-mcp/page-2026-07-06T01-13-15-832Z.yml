            - heading "1.1 需求" [level=1] [ref=f2e964]
            - blockquote [ref=f2e965]:
              - paragraph [ref=f2e966]:
                - text: 来源：
                - link "自学成AI产品经理" [ref=f2e967] [cursor=pointer]:
                  - /url: https://stevenjokess.github.io/2bPM/chapter_introduction/need.html
            - separator [ref=f2e968]
            - heading "📌 核心概念" [level=2] [ref=f2e969]
            - paragraph [ref=f2e970]:
              - text: 人类为了维持生活机能或健全心灵的基础满足条件，更多见
              - link "需求层次理论" [ref=f2e971] [cursor=pointer]:
                - /url: https://zh.wikipedia.org/wiki/%E9%9C%80%E6%B1%82%E5%B1%82%E6%AC%A1%E7%90%86%E8%AE%BA
            - paragraph [ref=f2e972]:
              - text: 需求是产品产生的前提，如果没有需求，产品也就不会存在，从而产品经理这个岗位也就不会存在了。
              - link "9" [ref=f2e973] [cursor=pointer]:
                - /url: https://www.zhihu.com/pub/reader/119980992/chapter/1284104614460440576
            - blockquote [ref=f2e974]:
              - paragraph [ref=f2e975]:
                - text: 💡
                - strong [ref=f2e976]: 需求蛋模型
                - text: ：需求总是含混的，做需求相关的工作，就是不断地降低含混。——《探索需求》
                - link "7" [ref=f2e977] [cursor=pointer]:
                  - /url: https://www.yinxiang.com/everhub/note/f9ab87ee-73e6-4241-9428-9507cbfd007f
            - paragraph [ref=f2e978]:
              - strong [ref=f2e979]: 需求决定产品核心价值
              - text: ：解决的需求越重要，你的产品核心价值就越大。
            - separator [ref=f2e980]
            - heading "🎯 别做「传话筒」" [level=2] [ref=f2e981]
            - paragraph [ref=f2e982]:
              - text: 产品经理作为需求「收纳箱」，要接收来自四面八方的需求，然后将需求串起来并进行有效的规划后，形成产品需求。可是很多时候，产品经理只是被动地接收需求，对需求不进行任何的分析和转换，直接就放到了产品规划清单里，等待着开发上线，似乎一切就这样完成了。
              - link "8" [ref=f2e983] [cursor=pointer]:
                - /url: https://www.zhihu.com/pub/reader/119980992/chapter/1284104607329615872
            - paragraph [ref=f2e984]: 如果只是简单传个话，公司直接用一支录音笔是否更合适呢？而且录音笔的保真率至少能够达到 95%，而人的保真率可能连 80% 都达不到。
            - blockquote [ref=f2e985]:
              - paragraph [ref=f2e986]:
                - text: ⚠️
                - strong [ref=f2e987]: 最糟情况
                - text: ：东西做出来了，对方不认可，而怪罪：
              - list [ref=f2e988]:
                - listitem [ref=f2e989]: 需求方提需求没说清楚（手机端搞成PC）
                - listitem [ref=f2e990]: 研发部实现不了（无第三方稳定接口、自研耗时长）
                - listitem [ref=f2e991]: 老板定的（先抓紧上线PC端，再慢慢研究手机端）
            - separator [ref=f2e992]
            - heading "📝 产品需求举例 13" [level=2] [ref=f2e993]:
              - text: 📝 产品需求举例
              - link "13" [ref=f2e994] [cursor=pointer]:
                - /url: http://www.shuahuangpu.com/articles/110937.html
            - list [ref=f2e995]:
              - listitem [ref=f2e996]:
                - strong [ref=f2e997]: 滴滴
                - text: ：解决了用户想要便捷出行的基本出行需求
              - listitem [ref=f2e998]:
                - strong [ref=f2e999]: 抖音
                - text: ：解决了新时代下用户的娱乐需求，表达展示自己的需求
              - listitem [ref=f2e1000]:
                - strong [ref=f2e1001]: 美团外卖
                - text: ：解决了用户懒和吃的需求，用户无需出门就能吃到想吃的东西
            - separator [ref=f2e1002]
            - heading "❓ 需求 or 伪需求" [level=2] [ref=f2e1003]
            - paragraph [ref=f2e1004]:
              - strong [ref=f2e1005]: 真需求
              - text: ："客户不是想买一个1英寸的电钻，而是想要一个1英寸的钻孔！"——市场营销学教授西奥多·莱维特
            - paragraph [ref=f2e1006]:
              - strong [ref=f2e1007]: 伪需求
              - text: ：有对大学情侣去酒店开房，和酒店的老板说开房的目的是为了考试想找个安静的地方学习。于是老板就把房间改成书房的形式，最后酒店倒闭了。从这里我们可以发现，情侣用学习来掩饰他们去酒店的真实动机，这也是人性使然。老板并没有理解到这对情侣的本质需求，以提供安静舒适的学习环境来满足情侣口中的"伪需求"，情侣的本质需求没有得到满足自然不会再来。
              - link "16" [ref=f2e1008] [cursor=pointer]:
                - /url: https://zhuanlan.zhihu.com/p/390835483
            - paragraph [ref=f2e1009]:
              - strong [ref=f2e1010]: 判断标准
              - text: ：
            - list [ref=f2e1011]:
              - listitem [ref=f2e1012]:
                - text: 是否是围绕主路径；迅雷：搜电影-下电影-看电影，"边看边播"、影评和打分
                - link "2" [ref=f2e1013] [cursor=pointer]:
                  - /url: http://www.woshipm.com/pmd/2903334.html
              - listitem [ref=f2e1014]: 该需求的使用频率；必须高频
            - separator [ref=f2e1015]
            - heading "🔄 需求来源" [level=2] [ref=f2e1016]
            - code [ref=f2e1018]: 商业 → 市场 → 用户 → 需求
            - paragraph [ref=f2e1019]:
              - link "14" [ref=f2e1020] [cursor=pointer]:
                - /url: https://zhuanlan.zhihu.com/p/25965712
            - separator [ref=f2e1021]
            - heading "📋 需求职责" [level=2] [ref=f2e1022]
            - paragraph [ref=f2e1023]:
              - text: 需求管理、需求定义、需求确认、需求跟踪等与需求相关的职责都是公司对产品经理最基本的要求。原因是产品经理是对公司产品的负责人，而产品是为用户解决某种特定需求的，因此即使我们来到了人工智能时代，产品依然是围绕用户需求定义的，这个本质是不变的。
              - link "12" [ref=f2e1024] [cursor=pointer]:
                - /url: https://zhuanlan.zhihu.com/p/36871139
            - separator [ref=f2e1025]
            - heading "🔍 需求采集" [level=2] [ref=f2e1026]
            - paragraph [ref=f2e1027]: 直接采集与间接采集，获取到的需求分别是一手需求与二手需求。
            - paragraph [ref=f2e1028]: 可以从两个角度来理解它们的差异：
            - list [ref=f2e1029]:
              - listitem [ref=f2e1030]: 需求的提出者是不是有需求的人
              - listitem [ref=f2e1031]: 需求是原始的还是加工过的
            - blockquote [ref=f2e1032]:
              - paragraph [ref=f2e1033]: 💡 比喻：生孩子与养孩子
            - paragraph [ref=f2e1034]:
              - strong [ref=f2e1035]: 关键点
              - text: ：
            - list [ref=f2e1036]:
              - listitem [ref=f2e1037]: 直接从用户处采集的一手需求更准确，所以产品经理一定要确保手里有足够比例的需求是直接采集的，这样才能让产品本身和自己对产品的判断更接地气
              - listitem [ref=f2e1038]:
                - text: 而从销售、营销、服务人员
                - link "6" [ref=f2e1039] [cursor=pointer]:
                  - /url: https://quizlet.com/129588206/%E4%BA%BA%E4%BA%BA%E9%83%BD%E6%98%AF%E4%BA%A7%E5%93%81%E7%BB%8F%E7%90%86-%E7%AC%94%E8%AE%B0-flash-cards/
                - text: 等间接采集的二手需求，有可能被扭曲，就需要带着"问号"来看，思考原始需求方和转述者分别是谁，以及它有没有被曲解过
              - listitem [ref=f2e1040]: 但二手需求（比如一份客户反馈周报）可以通过更多的人，收集到更多的用户声音，而且是经过梳理的，所以获取信息的效率更高
            - paragraph [ref=f2e1041]:
              - strong [ref=f2e1042]: 实践建议
              - text: ：团队内"全员参与采集，产品人员处理"是比较可行的模式，是一种效率和准确度的兼顾方案。
            - heading "用户需求 vs 产品需求" [level=3] [ref=f2e1043]
            - table [ref=f2e1044]:
              - rowgroup [ref=f2e1045]:
                - row "类型 定义" [ref=f2e1046]:
                  - columnheader "类型" [ref=f2e1047]
                  - columnheader "定义" [ref=f2e1048]
              - rowgroup [ref=f2e1049]:
                - row "用户需求 用户自以为的需求，并且经常表达为用户的解决方案" [ref=f2e1050]:
                  - cell "用户需求" [ref=f2e1051]
                  - cell "用户自以为的需求，并且经常表达为用户的解决方案" [ref=f2e1052]
                - row "产品需求 经过我们分析，找到的真实需求，并且表达为产品的解决方案" [ref=f2e1053]:
                  - cell "产品需求" [ref=f2e1054]
                  - cell "经过我们分析，找到的真实需求，并且表达为产品的解决方案" [ref=f2e1055]
                - row "需求分析 从用户需求出发，找到用户内心真正的渴望，再转化为产品需求的过程" [ref=f2e1056]:
                  - cell "需求分析" [ref=f2e1057]
                  - cell "从用户需求出发，找到用户内心真正的渴望，再转化为产品需求的过程" [ref=f2e1058]
            - code [ref=f2e1060]: 用户需求 →（需求分析）→ 产品需求
            - heading "直接采集的途径 3" [level=3] [ref=f2e1061]:
              - text: 直接采集的途径
              - link "3" [ref=f2e1062] [cursor=pointer]:
                - /url: http://www.woshipm.com/zhichang/459131.html
            - list [ref=f2e1063]:
              - listitem [ref=f2e1064]: 用户访谈提出需求（问题集中体现在视觉、交互或一些漏洞等体验侧层面）
              - listitem [ref=f2e1065]: 其他参与者和关注者反馈的需求
            - heading "间接采集的途径 3" [level=3] [ref=f2e1066]:
              - text: 间接采集的途径
              - link "3" [ref=f2e1067] [cursor=pointer]:
                - /url: http://www.woshipm.com/zhichang/459131.html
            - list [ref=f2e1068]:
              - listitem [ref=f2e1069]: 老板提出的战略性需求（往往体验侧的，给老板时间去深度思考）
              - listitem [ref=f2e1070]: 产品经理根据产品方向规划需求
              - listitem [ref=f2e1071]: 推广规划的活动和数据分析出来一些需求（反馈能够产生实际收益，更关注业务的优化空间）
            - separator [ref=f2e1072]
            - heading "✅ 满足需求 6" [level=2] [ref=f2e1073]:
              - text: ✅ 满足需求
              - link "6" [ref=f2e1074] [cursor=pointer]:
                - /url: https://quizlet.com/129588206/%E4%BA%BA%E4%BA%BA%E9%83%BD%E6%98%AF%E4%BA%A7%E5%93%81%E7%BB%8F%E7%90%86-%E7%AC%94%E8%AE%B0-flash-cards/
            - paragraph [ref=f2e1075]: 由于理想与现实的差距产生需求，所以满足需求有3种方式：
            - list [ref=f2e1076]:
              - listitem [ref=f2e1077]:
                - strong [ref=f2e1078]: 改变现状
              - listitem [ref=f2e1079]:
                - strong [ref=f2e1080]: 降低理想
              - listitem [ref=f2e1081]:
                - strong [ref=f2e1082]: 转移需求
            - heading "降低理想" [level=3] [ref=f2e1083]
            - heading "商业化与用户体验冲突" [level=4] [ref=f2e1084]
            - paragraph [ref=f2e1085]:
              - text: 对于中小企业的产品经理来说，生存才是第一要义，因此中小企业的产品经理一定要优先考虑商业化。产品经理只有在对利益诉求没有那么高的情况下，才会优先考虑用户体验。
              - link "10" [ref=f2e1086] [cursor=pointer]:
                - /url: https://www.zhihu.com/pub/reader/119980992/chapter/1284104619489460224
            - heading "先满足哪类用户？" [level=4] [ref=f2e1087]
            - paragraph [ref=f2e1088]: 如果说，普通用户有一个需求，核心用户也有一个需求，而且，两种用户群体的需求都是比较重要的大需求，那么，你觉得应该先满足哪类用户？
            - paragraph [ref=f2e1089]:
              - strong [ref=f2e1090]: 答案是先满足普通用户。
            - paragraph [ref=f2e1091]: 因为核心用户属于平台忠诚度非常高的用户群体，在产品里已经投入了较多的时间和精力，并不会因为你的需求稍微晚一些就选择离开；即使离开也只是暂时的，他还会回来的，因为这是沉没成本，而且你并没有做出严重伤害他们的行为。
            - blockquote [ref=f2e1092]:
              - paragraph [ref=f2e1093]: 💡 不论运营还是产品，都应该重视用户留存，也必须绝对肯定的要重视，甚至在产品的爆发期，留存大于一切。
            - heading "小众需求" [level=4] [ref=f2e1094]
            - paragraph [ref=f2e1095]:
              - text: 区别是小众还是大部分用户的需求，优先满足大部分用户的需求。
              - link "15" [ref=f2e1096] [cursor=pointer]:
                - /url: https://www.zhihu.com/question/59911327/answer/259895734
            - heading "转移需求" [level=3] [ref=f2e1097]
            - paragraph [ref=f2e1098]: 需求延期
            - separator [ref=f2e1099]
