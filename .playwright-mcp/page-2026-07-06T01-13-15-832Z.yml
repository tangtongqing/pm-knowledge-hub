            - separator [ref=f2e1120]
            - heading "👥 需求评审" [level=2] [ref=f2e1121]
            - paragraph [ref=f2e1122]: 统一思想，明确需求，确定实现过程的会议
            - paragraph [ref=f2e1123]:
              - img "需求评审参与人员" [ref=f2e1124]
            - separator [ref=f2e1125]
            - heading "📐 量化需求 11" [level=2] [ref=f2e1126]:
              - text: 📐 量化需求
              - link "11" [ref=f2e1127] [cursor=pointer]:
                - /url: http://www.xmamiga.com/3573/s
            - heading "为什么要量化需求" [level=3] [ref=f2e1128]
            - code [ref=f2e1130]: 基于概率 → 需求量化 → 技术可行性预研 → 得出结论 → 开发、测试、上线 → 复盘
            - paragraph [ref=f2e1131]: 在产品开始之前提出量化标准，方便对工作成果进行衡量；一般有三种结果：
            - list [ref=f2e1132]:
              - listitem [ref=f2e1133]: 存在"小数据"或若标注的情况 → 保持上线时间不变，需求更改：在算法精度上进行妥协【尽量避免】
              - listitem [ref=f2e1134]: 存在"小数据"或若标注的情况 → 保持量化标准不变：申请更多的资源【尽量避免】
              - listitem [ref=f2e1135]: 基于现有资源在规定时间内可以实现量化要求
            - heading "需要考虑的点" [level=3] [ref=f2e1136]
            - table [ref=f2e1137]:
              - rowgroup [ref=f2e1138]:
                - row "阶段 重点" [ref=f2e1139]:
                  - columnheader "阶段" [ref=f2e1140]
                  - columnheader "重点" [ref=f2e1141]
              - rowgroup [ref=f2e1142]:
                - row "预研期间 衡量数据质量、算力资源、上线时间，在算法精度上给出合理量化标准，或者要求增加资源投入" [ref=f2e1143]:
                  - cell "预研期间" [ref=f2e1144]
                  - cell "衡量数据质量、算力资源、上线时间，在算法精度上给出合理量化标准，或者要求增加资源投入" [ref=f2e1145]
                - row "开发、测试、上线后 对量化的目标进行精准地验证，进行 A/B 测试时可以比较 A、B 两个方案的效果" [ref=f2e1146]:
                  - cell "开发、测试、上线后" [ref=f2e1147]
                  - cell "对量化的目标进行精准地验证，进行 A/B 测试时可以比较 A、B 两个方案的效果" [ref=f2e1148]
                - row "复盘期间 总结量化评估经验，和研发团队沟通，了解团队技术实力和算法能力边界。争取量化更靠谱，减少需求变更和额外申请资源" [ref=f2e1149]:
                  - cell "复盘期间" [ref=f2e1150]
                  - cell "总结量化评估经验，和研发团队沟通，了解团队技术实力和算法能力边界。争取量化更靠谱，减少需求变更和额外申请资源" [ref=f2e1151]
